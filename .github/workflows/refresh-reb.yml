# Seoul Apartment Dashboard - monthly official R-ONE refresh and Pages deployment.
# IMPORTANT: In GitHub Settings > Pages, set Source to "GitHub Actions".
# API key must stay in repository Actions Secret REB_API_KEY.
# No actual API key is present in this file.
name: Refresh official REB price series

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'data/kb.json'
  workflow_dispatch:
  schedule:
    # 07:40 UTC = 16:40 Korea time, days 15-25 each month.
    - cron: '40 7 15-25 * *'

concurrency:
  group: reb-data-refresh
  cancel-in-progress: false

jobs:
  refresh-reb:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch validated official R-ONE statistics
        env:
          REB_API_KEY: ${{ secrets.REB_API_KEY }}
          REB_MEDIAN_STATBL_ID: ${{ vars.REB_MEDIAN_STATBL_ID }}
        run: |
          if [ -z "$REB_API_KEY" ]; then
            echo 'ERROR: GitHub Secret REB_API_KEY is missing.' >&2
            exit 1
          fi
          python scripts/update_reb.py --start 2000

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Commit new official data only if changed
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/reb.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh official REB Seoul apartment prices'
            git push origin HEAD:main
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'No new official data; no commit needed.'
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare public static site
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        run: |
          mkdir -p _site/data
          cp index.html _site/index.html
          cp data/reb.json data/kb.json data/import_template.csv _site/data/
          touch _site/.nojekyll

      - name: Configure Pages
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        uses: actions/configure-pages@v5

      - name: Upload public website artifact
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy-pages:
    needs: refresh-reb
    if: needs.refresh-reb.outputs.changed == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Allow artifact metadata to become available
        run: sleep 12
      - name: Publish official data dashboard
        id: deployment
        uses: actions/deploy-pages@v4
