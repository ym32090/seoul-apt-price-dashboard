# v1.8.3: KB four-series auto-update candidate, disabled until operator opt-in.
# KB endpoint is reverse-documented, NOT a KB-issued licensed public API.
# REVIEW KB service terms before enabling the variables below.
name: Refresh KB Seoul apartment prices (opt-in)

on:
  workflow_dispatch:
  schedule:
    # 08:40 KST on the 16th, 23rd and 28th each month (previous UTC day).
    - cron: '40 23 15,22,27 * *'

concurrency:
  group: kb-price-refresh
  cancel-in-progress: false

jobs:
  inspect-kb:
    if: vars.KB_AUTO_FETCH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Check out reference data
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test KB source parser and strict historical-price validation
        run: python scripts/update_kb.py --self-test --reference data/kb.json
      - name: Retrieve KB 4 series and prepare candidate only
        env:
          KB_AUTO_FETCH_ENABLED: ${{ vars.KB_AUTO_FETCH_ENABLED }}
        run: python scripts/update_kb.py --live --reference data/kb.json --candidate kb_candidate.json
      - name: Upload validated candidate (no public deployment)
        uses: actions/upload-artifact@v4
        with:
          name: kb-validated-candidate
          path: kb_candidate.json
          retention-days: 3
          if-no-files-found: error

  publish-kb:
    needs: inspect-kb
    if: vars.KB_AUTO_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
      pages: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Checkout original branch at workflow commit
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download candidate from read-only validation job
        uses: actions/download-artifact@v4
        with:
          name: kb-validated-candidate
          path: _candidate
      - name: Replace only kb.json after validation
        run: |
          python -m json.tool _candidate/kb_candidate.json >/dev/null
          cp _candidate/kb_candidate.json data/kb.json
      - name: Commit only when new validated values exist
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/kb.json
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'No new KB month: retained existing file.'
          else
            git commit -m 'data: refresh KB Seoul apartment prices after validation'
            git push origin HEAD:main
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Build static Pages artifact from verified data
        if: steps.commit.outputs.changed == 'true'
        run: |
          mkdir -p _site/data
          cp index.html _site/index.html
          cp data/reb.json data/kb.json data/import_template.csv _site/data/
          touch _site/.nojekyll
      - name: Configure GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: steps.commit.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy-kb-pages:
    needs: publish-kb
    if: needs.publish-kb.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Avoid artifact metadata propagation race
        run: sleep 12
      - name: Publish dashboard with updated KB prices
        id: deploy
        uses: actions/deploy-pages@v4
