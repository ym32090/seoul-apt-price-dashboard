# Complete replacement: read-only audit, no commits, no Pages deployment.
name: Audit R-ONE 2026 and rent prices (read only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-rone:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout code (read only)
        uses: actions/checkout@v4
      - name: Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inspect exact catalog IDs and full-history coverage safely
        env:
          REB_API_KEY: ${{ secrets.REB_API_KEY }}
        run: python scripts/audit_reb_prices.py
